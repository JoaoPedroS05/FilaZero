version: '3.8'

services:
  # 🗄️ Banco de Dados MySQL
  banco-semfila:
    image: mysql:8.0
    container_name: semfila_db
    restart: always
    environment:
      MYSQL_DATABASE: 'filazero_db'
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - '3307:3306'
    volumes:
      - dados_mysql:/var/lib/mysql
    # Garante que o Docker saiba exatamente quando o banco está pronto para uso
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      timeout: 5s
      retries: 5
      interval: 5s

  # 🚀 Backend API (.NET 8)
  api-semfila:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: semfila_api
    restart: always
    ports:
      - '5033:5033'
    environment:
      # CORRIGIDO: Agora o Docker injeta o valor real da variável do seu .env
      - ConnectionStrings__DefaultConnection=Server=banco-semfila;Database=filazero_db;Uid=root;Pwd=${MYSQL_ROOT_PASSWORD};
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__ExpiryInMinutes=${JWT_EXPIRY_IN_MINUTES}
      - GoogleMapsSettings__ApiKey=${GOOGLE_MAPS_KEY}
    depends_on:
      banco-semfila:
        condition: service_healthy

  # Frontend (React + Vite)
  web-semfila:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: semfila_web
    restart: always
    ports:
      - '5173:5173'
    environment:
      - VITE_API_URL=${VITE_API_URL} 
      - VITE_GOOGLE_MAPS_KEY=${VITE_GOOGLE_MAPS_KEY}
    depends_on:
      - api-semfila

volumes:
  dados_mysql: