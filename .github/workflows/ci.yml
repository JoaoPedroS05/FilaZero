name: Continuous Integration (CI)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # ─── JOB 1: Compilar Backend ──────────────────────────────────────────────
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o ambiente .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar as dependências (NuGet)
        run: dotnet restore
        working-directory: ./backend

      - name: Compilar o projeto (Build)
        run: dotnet build --no-restore --configuration Release
        working-directory: ./backend

  # ─── JOB 2: Testes Unitários do Backend ──────────────────────────────────
  backend-tests:
    runs-on: ubuntu-latest
    needs: backend-ci          # só roda se o build passou
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o ambiente .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependências do projeto de testes
        run: dotnet restore
        working-directory: ./backend.Tests

      - name: Executar testes xUnit
        run: dotnet test --no-restore --verbosity normal
        working-directory: ./backend.Tests

      - name: Coletar relatório de cobertura
        run: >
          dotnet test --no-restore
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
        working-directory: ./backend.Tests

      - name: Publicar relatório de cobertura como artefato
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: ./backend.Tests/TestResults

  # ─── JOB 3: Compilar Frontend ─────────────────────────────────────────────
  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Instalar as dependências (node_modules)
        run: npm ci
        working-directory: ./frontend

      - name: Verificar erros de compilação (Vite Build)
        run: npm run build
        working-directory: ./frontend

  # ─── JOB 4: Testes Unitários do Frontend ─────────────────────────────────
  frontend-tests:
    runs-on: ubuntu-latest
    needs: frontend-ci         # só roda se o build passou
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Instalar as dependências
        run: npm ci
        working-directory: ./frontend

      - name: Executar testes Vitest
        run: npm test
        working-directory: ./frontend

      - name: Gerar relatório de cobertura
        run: npm run test:coverage
        working-directory: ./frontend

      - name: Publicar relatório de cobertura como artefato
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: ./frontend/coverage
